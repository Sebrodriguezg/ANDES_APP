ight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">0/6 = 0%</text><text x="190.0" y="101.0" font-size="11" fill="#333" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">ALTO — patrones</text><rect x="200.0" y="86.0" width="590.0" height="22.0" fill="#F2F2F2" fill-opacity="1.0" rx="2"/><rect x="200.0" y="86.0" width="196.7" height="22.0" fill="#B00020" fill-opacity="1.0" rx="2"/><text x="403.7" y="101.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">2/6 = 33%</text><text x="200.0" y="212.0" font-size="10" fill="#888" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Si BASE va bajo, no sirve estudiar patrones. Si ALTO va bajo, es donde se decide el examen.</text></svg>