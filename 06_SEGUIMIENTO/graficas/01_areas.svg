20" fill-opacity="1.0" rx="2"/><text x="354.5" y="67.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">1/4 = 25%</text><text x="190.0" y="101.0" font-size="11" fill="#333" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Electromagnetismo (25%)</text><rect x="200.0" y="86.0" width="590.0" height="22.0" fill="#F2F2F2" fill-opacity="1.0" rx="2"/><rect x="200.0" y="86.0" width="196.7" height="22.0" fill="#B00020" fill-opacity="1.0" rx="2"/><text x="403.7" y="101.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">1/3 = 33%</text><text x="190.0" y="135.0" font-size="11" fill="#333" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Relatividad (8%)</text><rect x="200.0" y="120.0" width="590.0" height="22.0" fill="#F2F2F2" fill-opacity="1.0" rx="2"/><text x="207.0" y="135.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">0/1 = 0%</text><text x="190.0" y="169.0" font-size="11" fill="#333" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Termo y estadística (21%)</text><rect x="200.0" y="154.0" width="590.0" height="22.0" fill="#F2F2F2" fill-opacity="1.0" rx="2"/><text x="207.0" y="169.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">0/2 = 0%</text><text x="190.0" y="203.0" font-size="11" fill="#333" text-anchor="end" font-weight="bold" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Moderna y cuántica (13%)</text><rect x="200.0" y="188.0" width="590.0" height="22.0" fill="#F2F2F2" fill-opacity="1.0" rx="2"/><text x="207.0" y="203.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">0/2 = 0%</text><text x="200.0" y="240.0" font-size="10" fill="#888" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">Rojo: bajo 55%. Naranja: entre 55% y la meta. Verde: en meta.</text></svg>