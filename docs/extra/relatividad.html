<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatividad visual</title>
<style>
  :root { --bg:#0B0718; --panel:#150E2B; --panel2:#1D1439; --ink:#E8E2F2; --muted:#9C93B5; --tenue:#6F6690;
          --line:#2A1F4A; --acc:#FCA50A; --rel:#D14263; --ok:#F6D543; --azul:#6EA8FF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:980px; margin:0 auto; padding:12px 16px 40px; }
  h1 { font-size:19px; margin:6px 0 2px; }
  p.sub { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .tabs { display:flex; gap:6px; margin:8px 0 10px; }
  .tabs button { flex:1; font:inherit; font-size:14px; padding:9px 6px; border-radius:2px; border:1px solid var(--line);
                 background:var(--panel); color:var(--ink); cursor:pointer; }
  .tabs button.on { background:var(--acc); color:#0B0718; border-color:var(--acc); font-weight:700; }
  canvas { width:100%; display:block; border:1px solid var(--line); border-radius:2px; background:#100A22; touch-action:pinch-zoom; }
  .rotulo { font:600 11px/1 ui-monospace, monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin:14px 0 6px; }
  .ctrl { background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:12px 14px; margin-top:10px; }
  label { display:block; font-size:13px; color:var(--muted); margin-top:6px; }
  label b { color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .fila { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .fila button { font:inherit; font-size:13px; padding:6px 10px; border-radius:2px; border:1px solid var(--line);
                 background:var(--panel2); color:var(--ink); cursor:pointer; }
  .fila button.on { border-color:var(--acc); color:var(--acc); }
  .fila button.prin { background:var(--acc); color:#0B0718; border-color:var(--acc); font-weight:700; }
  .info { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--rel); border-radius:2px;
          padding:12px 14px; margin-top:10px; }
  .info h3 { font-size:13px; margin:12px 0 4px; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
  .info h3:first-child { margin-top:0; }
  .info p { margin:4px 0; }
  .f { font-family:ui-monospace, monospace; font-size:14px; background:var(--panel2); padding:1px 5px; border-radius:2px; }
  .caja { background:var(--panel2); border:1px solid var(--line); padding:8px 10px; margin:6px 0; border-radius:2px; }
  .trampa { color:#FF7FB5; font-weight:600; }
  .oculto { display:none !important; }

  /* ── ANDES: paleta de la app (va al final para ganar) ── */
  :root { --bg:#0B0718; --panel:#150E2B; --ink:#E8E2F2; --muted:#9C93B5; --line:#2A1F4A; --acc:#FCA50A; --warn:#FF4F9A; }
  .seg button.on, button.main { color:#0B0718 !important; font-weight:600; }
  main { padding-top:8px; }
  canvas { border-radius:2px !important; touch-action:pinch-zoom; }
  input[type=range], input[type=checkbox] { accent-color:#FCA50A; }
</style>
<meta name="theme-color" content="#0B0718">
<link rel="stylesheet" href="comun.css">
</head>
<body>
<div class="andes-barra"><a href="../index.html#material">← Material</a><span class="andes-titulo">Relatividad</span><button type="button" id="andes-completa">⤢ Pantalla completa</button></div>

<main>
  <h1>Relatividad especial, vista</h1>
  <p class="sub">Arriba la animación, abajo el diagrama de espacio-tiempo de lo mismo. Mueve β y mira qué cambia.</p>

  <div class="tabs" id="tabs">
    <button data-m="dilatacion" class="on">Dilatación</button>
    <button data-m="contraccion">Contracción</button>
    <button data-m="doppler">Doppler</button>
  </div>

  <canvas id="anim"></canvas>

  <div class="ctrl">
    <label>Velocidad β = v/c: <b id="vb">0.60</b> &nbsp;·&nbsp; γ = <b id="vg">1.25</b></label>
    <input id="beta" type="range" min="0" max="0.95" step="0.01" value="0.6">
    <div class="fila" id="presets">
      <button data-b="0.6">β = 0.6 → γ = 5/4</button>
      <button data-b="0.8">β = 0.8 → γ = 5/3</button>
      <button data-b="0.866">β = 0.866 → γ = 2</button>
    </div>
    <div class="fila">
      <button id="play" class="prin">❚❚ Pausa</button>
      <button id="reset">⟲ Reiniciar</button>
      <button id="lento">Lento</button>
    </div>
    <div class="fila" id="marcos">
      <button data-f="S" class="on">Visto desde el andén</button>
      <button data-f="T">Visto desde el tren</button>
    </div>
    <div id="ctrlDop">
      <label>Longitud de onda emitida λ₀: <b id="vl">550</b> nm</label>
      <input id="lam" type="range" min="380" max="700" step="5" value="550">
      <div class="fila"><button id="caso22">Caso n.º 22 del 2024 (λ₀ = 400 nm, ionizar con 6.2 eV)</button></div>
    </div>
  </div>

  <div class="rotulo" id="rotDiag">Diagrama de espacio-tiempo</div>
  <canvas id="diag"></canvas>

  <div class="info" id="info"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const S = { modo:'dilatacion', beta:0.6, play:true, vel:1, marco:'S', T:0, lam0:550 };
const gam = b => 1 / Math.sqrt(1 - b * b);
const COL = { bg:'#100A22', ink:'#E8E2F2', muted:'#9C93B5', tenue:'#6F6690', line:'#2A1F4A', acc:'#FCA50A',
              rel:'#D14263', ok:'#F6D543', azul:'#6EA8FF', foton:'#FCFFA4' };
const dpr = Math.min(2, window.devicePixelRatio || 1);

function ajustar(cv, ratio) {
  const w = cv.clientWidth || 360, h = Math.round(w * ratio);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
const angosto = () => (document.querySelector('main').clientWidth < 600);

function texto(ctx, s, x, y, { c = COL.ink, f = 12, b = false, al = 'left', bl = 'alphabetic' } = {}) {
  ctx.fillStyle = c; ctx.font = `${b ? '600 ' : ''}${f}px system-ui, sans-serif`;
  ctx.textAlign = al; ctx.textBaseline = bl; ctx.fillText(s, x, y);
}
function linea(ctx, x1, y1, x2, y2, c, w = 1, dash = null) {
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}
function punto(ctx, x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function flecha(ctx, x1, y1, x2, y2, c, w = 1.5) {
  linea(ctx, x1, y1, x2, y2, c, w);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 7;
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - s * Math.cos(a - .4), y2 - s * Math.sin(a - .4));
  ctx.lineTo(x2 - s * Math.cos(a + .4), y2 - s * Math.sin(a + .4)); ctx.fill();
}

/* Longitud de onda → color (380–700 nm); fuera del visible, gris con rótulo. */
function colorLambda(l) {
  let r = 0, g = 0, b = 0;
  if (l >= 380 && l < 440) { r = -(l - 440) / 60; b = 1; }
  else if (l < 490) { g = (l - 440) / 50; b = 1; }
  else if (l < 510) { g = 1; b = -(l - 510) / 20; }
  else if (l < 580) { r = (l - 510) / 70; g = 1; }
  else if (l < 645) { r = 1; g = -(l - 645) / 65; }
  else if (l <= 780) { r = 1; }
  if (l < 380) return '#B9A6FF';   // UV: violeta pálido
  if (l > 780) return '#8A5A5A';   // IR: rojo apagado
  const f = l < 420 ? .3 + .7 * (l - 380) / 40 : l > 700 ? .3 + .7 * (780 - l) / 80 : 1;
  const k = v => Math.round(255 * Math.pow(v * f, .8));
  return `rgb(${k(r)},${k(g)},${k(b)})`;
}
const nombreLambda = l => l < 380 ? 'ultravioleta' : l > 750 ? 'infrarrojo' : l < 450 ? 'violeta' : l < 495 ? 'azul'
  : l < 570 ? 'verde' : l < 590 ? 'amarillo' : l < 620 ? 'naranja' : 'rojo';

/* ═════════════════════════  DILATACIÓN  ═════════════════════════ */

function animDilatacion() {
  const { ctx, w, h } = ajustar($('anim'), angosto() ? 1.0 : 0.56);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  const b = S.beta, g = gam(b);
  const y0 = h * (angosto() ? 0.34 : 0.30), L = h * (angosto() ? 0.30 : 0.38), y1 = y0 + L;   // espejos
  const c = L / 1.1;                                        // px por segundo de animación
  const P0 = 2 * L / c, P = g * P0;                         // períodos: quieto y en movimiento
  const xA = w * (angosto() ? 0.30 : 0.36);                  // separación de paneles
  linea(ctx, xA, 10, xA, h - 10, COL.line, 1);

  // ── Panel 1: reloj quieto en el laboratorio
  texto(ctx, 'Reloj quieto', xA / 2, 20, { al:'center', b:true });
  texto(ctx, '(marca el tiempo del lab, t)', xA / 2, 36, { al:'center', c:COL.muted, f:11 });
  const xc = xA / 2;
  dibujarReloj(ctx, xc, y0, y1);
  const f0 = (S.T % P0) / P0, yf0 = f0 < .5 ? y1 - (y1 - y0) * f0 * 2 : y0 + (y1 - y0) * (f0 - .5) * 2;
  linea(ctx, xc, y1, xc, yf0, 'rgba(252,255,164,.35)', 2);
  punto(ctx, xc, yf0, 5, COL.foton);
  const n0 = Math.floor(S.T / P0);

  // ── Panel 2: el mismo reloj moviéndose a v
  texto(ctx, 'El mismo reloj, a velocidad v →', (xA + w) / 2, 20, { al:'center', b:true });
  texto(ctx, '(marca su tiempo propio, τ)', (xA + w) / 2, 36, { al:'center', c:COL.muted, f:11 });
  const izq = xA + 22, der = w - 22, rango = der - izq;
  const xRel = s => izq + ((b * c * s) % rango + rango) % rango;
  // rastro del fotón durante el ciclo en curso (se corta donde el reloj da la vuelta)
  const k = Math.floor(S.T / P), t0 = k * P;
  ctx.strokeStyle = 'rgba(252,255,164,.55)'; ctx.lineWidth = 2; ctx.beginPath();
  let prevX = null;
  for (let s = t0; s <= S.T + 1e-9; s += P / 120) {
    const fr = (s - t0) / P, x = xRel(s);
    const y = fr < .5 ? y1 - (y1 - y0) * fr * 2 : y0 + (y1 - y0) * (fr - .5) * 2;
    if (prevX === null || x < prevX) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    prevX = x;
  }
  ctx.stroke();
  // evento A (salida) y, si ya pasó la mitad, el vértice
  const xa = xRel(t0);
  if (xa <= xRel(S.T)) { punto(ctx, xa, y1 + 10, 4, COL.rel); texto(ctx, 'A', xa, y1 + 26, { al:'center', c:COL.rel, b:true }); }
  const xr = xRel(S.T), fr = (S.T - t0) / P;
  const yr = fr < .5 ? y1 - (y1 - y0) * fr * 2 : y0 + (y1 - y0) * (fr - .5) * 2;
  dibujarReloj(ctx, xr, y0, y1);
  punto(ctx, xr, yr, 5, COL.foton);
  const n1 = Math.floor(S.T / P);

  // contadores
  const yc = h - (angosto() ? 54 : 40);
  texto(ctx, `t = ${(S.T / P0).toFixed(2)}`, xc, yc, { al:'center', f:16, b:true, c:COL.ok });
  texto(ctx, `τ = ${(S.T / P).toFixed(2)}`, (xA + w) / 2, yc, { al:'center', f:16, b:true, c:COL.rel });
  texto(ctx, `τ/t = 1/γ = ${(1 / g).toFixed(2)}  ·  ${n1} tics contra ${n0}`, (xA + w) / 2, yc + 18, { al:'center', c:COL.muted, f:11 });
  texto(ctx, '(en tics)', xc, yc + 18, { al:'center', c:COL.muted, f:11 });

  // recuadro del triángulo (a escala propia)
  const bw = angosto() ? 110 : 150, bh = angosto() ? 70 : 92, bx = w - bw - 8, by = 44;
  ctx.fillStyle = 'rgba(21,14,43,.92)'; ctx.fillRect(bx, by, bw, bh); ctx.strokeStyle = COL.line; ctx.strokeRect(bx, by, bw, bh);
  const esc = Math.min((bw - 24) / Math.max(b * g, .01), (bh - 30) / g, 60);
  const px0 = bx + 10, py0 = by + bh - 10, vy = esc * 1, vx = esc * b * g;
  ctx.fillStyle = 'rgba(209,66,99,.18)'; ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(px0 + vx, py0); ctx.lineTo(px0 + vx, py0 - vy); ctx.fill();
  linea(ctx, px0, py0, px0 + vx, py0 - vy, COL.foton, 1.5);
  linea(ctx, px0 + vx, py0, px0 + vx, py0 - vy, COL.ok, 1.5);
  linea(ctx, px0, py0, px0 + vx, py0, COL.azul, 1.5);
  texto(ctx, 'cΔτ/2', px0 + vx + 3, py0 - vy / 2, { c:COL.ok, f:10 });
  texto(ctx, 'vΔt/2', px0 + vx / 2, py0 + 9, { c:COL.azul, f:10, al:'center' });
  texto(ctx, 'cΔt/2', px0 + vx / 2 - 6, py0 - vy / 2 - 4, { c:COL.foton, f:10, al:'right' });
  texto(ctx, '(cΔt)² = (cΔτ)² + (vΔt)²', bx + bw / 2, by + 12, { c:COL.ink, f:10, al:'center' });
}

function dibujarReloj(ctx, x, y0, y1) {
  linea(ctx, x - 18, y0 - 3, x + 18, y0 - 3, COL.muted, 3);
  linea(ctx, x - 18, y1 + 3, x + 18, y1 + 3, COL.muted, 3);
  linea(ctx, x - 18, y0 - 3, x - 18, y1 + 3, COL.line, 1);
  linea(ctx, x + 18, y0 - 3, x + 18, y1 + 3, COL.line, 1);
}

/* Diagrama de Minkowski genérico: eje x horizontal, ct vertical, 45° = luz. */
function marco(ctx, w, h, xmax, ctmax) {
  const m = { l:36, r:14, t:14, b:30 };
  const u = Math.min((w - m.l - m.r) / xmax, (h - m.t - m.b) / ctmax);
  const X = x => m.l + x * u, Y = ct => h - m.b - ct * u;
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  for (let i = 1; i <= Math.floor(xmax); i++) linea(ctx, X(i), Y(0), X(i), Y(ctmax), 'rgba(42,31,74,.6)');
  for (let i = 1; i <= Math.floor(ctmax); i++) linea(ctx, X(0), Y(i), X(xmax), Y(i), 'rgba(42,31,74,.6)');
  flecha(ctx, X(0), Y(0), X(xmax), Y(0), COL.muted, 1.2); flecha(ctx, X(0), Y(0), X(0), Y(ctmax), COL.muted, 1.2);
  texto(ctx, 'x', X(xmax) - 4, Y(0) + 16, { c:COL.muted, al:'right' });
  texto(ctx, 'ct', X(0) - 6, Y(ctmax) + 10, { c:COL.muted, al:'right' });
  for (let i = 1; i <= Math.floor(ctmax); i++) texto(ctx, i, X(0) - 6, Y(i) + 4, { c:COL.tenue, f:10, al:'right' });
  for (let i = 1; i <= Math.floor(xmax); i++) texto(ctx, i, X(i), Y(0) + 14, { c:COL.tenue, f:10, al:'center' });
  const lm = Math.min(xmax, ctmax);
  linea(ctx, X(0), Y(0), X(lm), Y(lm), 'rgba(252,255,164,.25)', 1, [4, 4]);
  texto(ctx, 'luz', X(lm * .92), Y(lm * .92) - 4, { c:'rgba(252,255,164,.5)', f:10, al:'right' });
  return { X, Y, u };
}

function diagDilatacion() {
  const { ctx, w, h } = ajustar($('diag'), angosto() ? 1.05 : 0.62);
  const b = S.beta, g = gam(b);
  const ctmax = 5.4, xmax = Math.max(3, b * ctmax + 0.5) * (angosto() ? 1 : 1.6);
  const { X, Y } = marco(ctx, w, h, Math.min(xmax, 9), ctmax);
  // hipérbolas de tiempo propio constante: (ct)² − x² = k²
  for (let k2 = 1; k2 <= 5; k2++) {
    ctx.strokeStyle = 'rgba(246,213,67,.18)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= 9; x += .05) { const ct = Math.sqrt(k2 * k2 + x * x); if (ct > ctmax) break; x ? ctx.lineTo(X(x), Y(ct)) : ctx.moveTo(X(x), Y(ct)); }
    ctx.stroke();
  }
  // reloj quieto: eje ct, tics en ct = 1, 2, 3…
  linea(ctx, X(0), Y(0), X(0), Y(ctmax), COL.ok, 2.5);
  for (let k = 1; k <= 5; k++) punto(ctx, X(0), Y(k), 3.5, COL.ok);
  // reloj en movimiento: línea de universo x = β ct, tics en (βγk, γk)
  const ctFin = ctmax;
  linea(ctx, X(0), Y(0), X(b * ctFin), Y(ctFin), COL.rel, 2.5);
  texto(ctx, "eje ct' = reloj que se mueve", X(b * ctFin * .55) + 8, Y(ctFin * .55), { c:COL.rel, f:11 });
  linea(ctx, X(0), Y(0), X(Math.min(9, ctmax / Math.max(b, .01))), Y(Math.min(ctmax, 9 * b)), 'rgba(209,66,99,.35)', 1, [5, 4]);
  texto(ctx, "x'", X(Math.min(8.6, 4.6)) , Y(Math.min(ctmax, 4.6 * b)) - 6, { c:'rgba(209,66,99,.7)', f:11 });
  for (let k = 1; k <= 5; k++) {
    if (g * k > ctmax) break;
    punto(ctx, X(b * g * k), Y(g * k), 4, COL.rel);
    if (k === 1) {
      linea(ctx, X(b * g), Y(g), X(0), Y(g), COL.azul, 1.5, [5, 4]);
      texto(ctx, `ct = γ = ${g.toFixed(2)}`, X(0) + 4, Y(g) - 5, { c:COL.azul, f:11, b:true });
      texto(ctx, 'Δτ = 1 (su primer tic)', X(b * g) + 8, Y(g) + 4, { c:COL.rel, f:11, b:true });
    }
  }
  // instante actual en el lab (línea de simultaneidad horizontal)
  const P0 = 2.2;                           // mismo período que la animación (2L/c, en segundos)
  const ctNow = (S.T / P0) % ctmax;
  linea(ctx, X(0), Y(ctNow), X(9), Y(ctNow), 'rgba(252,165,10,.55)', 1, [2, 3]);
  punto(ctx, X(0), Y(ctNow), 4, COL.ok); punto(ctx, X(b * ctNow), Y(ctNow), 4.5, COL.rel);
  texto(ctx, 'ahora (lab)', X(0) + 4, Y(ctNow) - 4, { c:COL.acc, f:10 });
}

/* ═════════════════════════  CONTRACCIÓN  ═════════════════════════ */

const L0 = 4;        // longitud propia del tren, en unidades de la regla

function animContraccion() {
  const { ctx, w, h } = ajustar($('anim'), angosto() ? 0.95 : 0.5);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  const b = S.beta, g = gam(b);
  const u = w / 11;                 // px por unidad (en el sistema de quien mira)
  const yv = h * 0.52, yAnd = h * 0.70;
  const vel = u * 1.6;              // px/s a β = 1
  const desdeTren = S.marco === 'T';

  // Fantasma arriba: el tren en reposo, con su longitud propia
  texto(ctx, desdeTren ? 'El andén en reposo (su longitud propia):' : 'El tren en reposo (su longitud propia L₀ = 4):',
        12, 22, { c:COL.muted, f:12 });
  if (!desdeTren) dibujarTren(ctx, 12, 34, L0 * u, u, 'rgba(232,226,242,.25)', 1);
  else dibujarRegla(ctx, 12, 44, 8 * u, u, 1, 'rgba(232,226,242,.35)');

  if (!desdeTren) {
    // ─ Sistema del andén: regla quieta, tren contraído moviéndose
    dibujarRegla(ctx, 0, yAnd, w, u, 1, COL.muted);
    texto(ctx, 'andén (regla en reposo)', 8, yAnd + 36, { c:COL.muted, f:11 });
    const Lc = L0 / g * u;
    const recorrido = w + Lc;
    const xt = ((b * vel * S.T) % recorrido + recorrido) % recorrido - Lc;
    dibujarTren(ctx, xt, yv - 30, Lc, u / g, COL.rel, 1);
    flecha(ctx, xt + Lc + 6, yv - 16, xt + Lc + 30, yv - 16, COL.rel);
    // medida: marcas simultáneas en el andén cuando el centro cruza la mitad
    const centro = xt + Lc / 2;
    if (Math.abs(centro - w / 2) < b * vel * 0.03 + 2) S.marcas = { a: xt, f: xt + Lc, t: S.T };
    if (S.marcas) {
      const { a, f } = S.marcas;
      linea(ctx, a, yv - 36, a, yAnd + 4, COL.ok, 1.5, [4, 3]); linea(ctx, f, yv - 36, f, yAnd + 4, COL.ok, 1.5, [4, 3]);
      punto(ctx, a, yAnd, 4, COL.ok); punto(ctx, f, yAnd, 4, COL.ok);
      flecha(ctx, (a + f) / 2, yAnd + 22, a + 2, yAnd + 22, COL.ok, 1.2); flecha(ctx, (a + f) / 2, yAnd + 22, f - 2, yAnd + 22, COL.ok, 1.2);
      texto(ctx, `L = L₀/γ = ${(L0 / g).toFixed(2)}`, (a + f) / 2, yAnd + 50, { c:COL.ok, f:13, b:true, al:'center' });
      if (S.T - S.marcas.t < .35) { punto(ctx, a, yv - 14, 9, 'rgba(246,213,67,.5)'); punto(ctx, f, yv - 14, 9, 'rgba(246,213,67,.5)'); }
    }
    texto(ctx, angosto() ? 'Destellos simultáneos para el andén' : 'Dos destellos AL MISMO TIEMPO (para el andén) marcan las dos puntas del tren', w / 2, h - 10,
          { c:COL.muted, f:11, al:'center' });
  } else {
    // ─ Sistema del tren: tren quieto y largo, andén contraído yendo a la izquierda
    const Lt = L0 * u, xt = (w - Lt) / 2;
    dibujarTren(ctx, xt, yv - 30, Lt, u, COL.rel, 1);
    const desp = -b * vel * S.T;
    dibujarRegla(ctx, 0, yAnd, w, u / g, 1, COL.muted, desp);
    flecha(ctx, 40, yAnd + 44, 10, yAnd + 44, COL.muted);
    texto(ctx, 'el andén se mueve ← y su regla está contraída', 46, yAnd + 48, { c:COL.muted, f:11 });
    // Los dos destellos: el de adelante primero, el de atrás βL₀ (en tiempo de luz) después
    const ciclo = 4.0, fase = S.T % ciclo, retraso = b * L0 * 0.25;
    const tF = 1.0, tA = tF + retraso;
    if (fase >= tF) {
      const xf = xt + Lt - b * vel * (fase - tF);
      punto(ctx, xf, yAnd, 4, COL.ok); linea(ctx, xt + Lt, yv - 36, xt + Lt, yv, COL.ok, 1.5, [4, 3]);
      texto(ctx, '1.º adelante', xt + Lt, yv - 42, { c:COL.ok, f:11, al:'center', b:true });
      if (fase - tF < .3) punto(ctx, xt + Lt, yv - 14, 9, 'rgba(246,213,67,.5)');
    }
    if (fase >= tA) {
      const xa = xt - b * vel * (fase - tA);
      punto(ctx, xa, yAnd, 4, COL.ok); linea(ctx, xt, yv - 36, xt, yv, COL.ok, 1.5, [4, 3]);
      texto(ctx, '2.º atrás', xt, yv - 42, { c:COL.ok, f:11, al:'center', b:true });
      if (fase - tA < .3) punto(ctx, xt, yv - 14, 9, 'rgba(246,213,67,.5)');
    }
    texto(ctx, angosto() ? 'Para el tren, el de adelante va primero' : 'Para el tren los destellos NO son simultáneos: el de adelante va primero', w / 2, h - 10,
          { c:COL.muted, f:11, al:'center' });
  }
}

function dibujarTren(ctx, x, y, L, paso, c, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c === COL.rel ? 'rgba(209,66,99,.25)' : 'rgba(232,226,242,.06)';
  ctx.fillRect(x, y, L, 28); ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.strokeRect(x, y, L, 28);
  for (let s = paso; s < L - 1; s += paso) linea(ctx, x + s, y + 18, x + s, y + 28, c, 1);
  ctx.globalAlpha = 1;
}
function dibujarRegla(ctx, x0, y, ancho, paso, alpha, c, desp = 0) {
  linea(ctx, x0, y, x0 + ancho, y, c, 2);
  const ini = ((desp % paso) + paso) % paso;
  let n = Math.round((ini - desp) / paso);
  for (let s = ini; s <= ancho; s += paso, n++) {
    linea(ctx, x0 + s, y, x0 + s, y + 8, c, 1);
    if (paso > 18) texto(ctx, n, x0 + s, y + 20, { c:COL.tenue, f:9, al:'center' });
  }
}

function diagContraccion() {
  const { ctx, w, h } = ajustar($('diag'), angosto() ? 1.05 : 0.62);
  const b = S.beta, g = gam(b);
  const xmax = Math.max(g * L0 + 1, L0 + 1.5) * (angosto() ? 1 : 1.25), ctmax = Math.max(b * g * L0 + 2, 4.5);
  const { X, Y } = marco(ctx, w, h, xmax, ctmax);
  // franja del tren: atrás x = β ct, adelante x = β ct + L0/γ
  ctx.fillStyle = 'rgba(209,66,99,.16)'; ctx.beginPath();
  ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(L0 / g), Y(0)); ctx.lineTo(X(L0 / g + b * ctmax), Y(ctmax)); ctx.lineTo(X(b * ctmax), Y(ctmax)); ctx.fill();
  linea(ctx, X(0), Y(0), X(b * ctmax), Y(ctmax), COL.rel, 2);
  linea(ctx, X(L0 / g), Y(0), X(L0 / g + b * ctmax), Y(ctmax), COL.rel, 2);
  texto(ctx, 'cola', X(b * ctmax) - 4, Y(ctmax) + 12, { c:COL.rel, f:10, al:'right' });
  texto(ctx, 'punta', X(L0 / g + b * ctmax) + 4, Y(ctmax) + 12, { c:COL.rel, f:10 });
  // corte del andén: ct = 0 (horizontal) → L0/γ
  linea(ctx, X(0), Y(0), X(L0 / g), Y(0), COL.ok, 4);
  texto(ctx, `andén: L₀/γ = ${(L0 / g).toFixed(2)}`, X(L0 / (2 * g)), Y(0) - 8, { c:COL.ok, f:11, b:true, al:'center' });
  // eje x' del tren: ct = β x, corta la punta en (γL0, βγL0) → ahí mide L0
  const Px = g * L0, Pct = b * g * L0;
  linea(ctx, X(0), Y(0), X(Math.min(xmax, Px * 1.15)), Y(Math.min(ctmax, Pct * 1.15)), 'rgba(110,168,255,.5)', 1, [5, 4]);
  linea(ctx, X(0), Y(0), X(Px), Y(Pct), COL.azul, 4);
  punto(ctx, X(Px), Y(Pct), 4, COL.azul);
  texto(ctx, `tren (su x'): L₀ = ${L0}`, X(Px) - 4, Y(Pct) - 10, { c:COL.azul, f:11, b:true, al:'right' });
  // hipérbola de calibración x² − (ct)² = L0²: mismo intervalo que x = L0 en el andén
  ctx.strokeStyle = 'rgba(110,168,255,.35)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath();
  for (let ct = 0; ct <= ctmax; ct += .05) { const x = Math.sqrt(L0 * L0 + ct * ct); if (x > xmax) break; ct ? ctx.lineTo(X(x), Y(ct)) : ctx.moveTo(X(x), Y(ct)); }
  ctx.stroke(); ctx.setLineDash([]);
  punto(ctx, X(L0), Y(0), 3, 'rgba(110,168,255,.7)');
  texto(ctx, 'L₀', X(L0), Y(0) + 26, { c:COL.azul, f:10, al:'center' });
}

/* ═════════════════════════  DOPPLER  ═════════════════════════ */

let frentes = [], tUltimo = -1e9, xFuente0 = 0;

function animDoppler() {
  const { ctx, w, h } = ajustar($('anim'), angosto() ? 0.95 : 0.52);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  const b = S.beta, g = gam(b), yc = h * 0.5;
  const c = Math.min(w, h * 1.6) * 0.16;          // px/s
  const T0 = 0.42, Tlab = g * T0;                 // período propio y el del lab (dilatado)
  const xs0 = w * 0.18, xs = xs0 + b * c * (S.T % (w * 0.64 / Math.max(b * c, 1e-6)));
  const vuelta = Math.floor(S.T / (w * 0.64 / Math.max(b * c, 1e-6)));
  if (vuelta !== S.vuelta) { frentes = []; S.vuelta = vuelta; tUltimo = -1e9; }
  if (S.T - tUltimo >= Tlab) { tUltimo = S.T; frentes.push({ x: xs, t: S.T }); }
  frentes = frentes.filter(f => c * (S.T - f.t) < w * 1.2);
  // frentes: circunferencias coloreadas por la λ que se recibe en cada dirección
  for (const f of frentes) {
    const r = c * (S.T - f.t); if (r < 2) continue;
    for (let i = 0; i < 48; i++) {
      const a1 = i / 48 * 2 * Math.PI, a2 = (i + 1) / 48 * 2 * Math.PI, am = (a1 + a2) / 2;
      const lam = S.lam0 * g * (1 - b * Math.cos(am));   // λ_obs = λ₀ γ (1 − β cos θ), θ medido en el lab
      ctx.strokeStyle = colorLambda(lam); ctx.globalAlpha = Math.max(.15, 1 - r / (w * 1.1)); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(f.x, yc, r, -a2, -a1); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  punto(ctx, xs, yc, 7, colorLambda(S.lam0)); flecha(ctx, xs + 10, yc, xs + 34, yc, COL.ink);
  texto(ctx, 'fuente', xs, yc + 22, { c:COL.ink, f:11, al:'center' });
  // observadores
  const ld = S.lam0 * Math.sqrt((1 - b) / (1 + b)), lt = S.lam0 * Math.sqrt((1 + b) / (1 - b));
  observador(ctx, w - 30, yc, ld, 'delante (se acercan)', 'right');
  observador(ctx, 30, yc, lt, 'detrás (se alejan)', 'left');
  texto(ctx, `emite λ₀ = ${S.lam0} nm (${nombreLambda(S.lam0)})`, w / 2, 20, { c:COL.muted, f:12, al:'center' });
}
function observador(ctx, x, y, lam, rot, lado) {
  ctx.fillStyle = colorLambda(lam); ctx.fillRect(x - 6, y - 40, 12, 80);
  ctx.strokeStyle = COL.ink; ctx.strokeRect(x - 6, y - 40, 12, 80);
  const al = lado === 'right' ? 'right' : 'left', dx = lado === 'right' ? -12 : 12;
  texto(ctx, rot, x + dx, y - 50, { c:COL.muted, f:11, al });
  texto(ctx, `${lam.toFixed(0)} nm`, x + dx, y + 56, { c:colorLambda(lam), f:15, b:true, al });
  texto(ctx, nombreLambda(lam), x + dx, y + 72, { c:COL.muted, f:11, al });
  texto(ctx, `E = ${(1240 / lam).toFixed(2)} eV`, x + dx, y + 88, { c:COL.muted, f:11, al });
}

function diagDoppler() {
  const { ctx, w, h } = ajustar($('diag'), angosto() ? 0.85 : 0.5);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  const m = { l:46, r:16, t:16, b:34 };
  const X = b => m.l + b / 0.95 * (w - m.l - m.r);
  const ymin = Math.log(0.15), ymax = Math.log(6.5);
  const Y = v => m.t + (ymax - Math.log(v)) / (ymax - ymin) * (h - m.t - m.b);
  for (const v of [0.25, 0.5, 1, 2, 4]) { linea(ctx, m.l, Y(v), w - m.r, Y(v), v === 1 ? COL.muted : 'rgba(42,31,74,.8)'); texto(ctx, v, m.l - 6, Y(v) + 4, { c:COL.tenue, f:10, al:'right' }); }
  for (const bb of [0, .2, .4, .6, .8]) { linea(ctx, X(bb), m.t, X(bb), h - m.b, 'rgba(42,31,74,.8)'); texto(ctx, bb, X(bb), h - m.b + 14, { c:COL.tenue, f:10, al:'center' }); }
  texto(ctx, 'β', w - m.r, h - 8, { c:COL.muted, al:'right' });
  texto(ctx, 'λ/λ₀ (escala log)', m.l + 4, m.t + 10, { c:COL.muted, f:11 });
  const curva = (fn, col, dash) => {
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash(dash || []); ctx.beginPath();
    for (let bb = 0; bb <= 0.95; bb += .005) { const v = fn(bb); if (v < 0.15 || v > 6.5) continue; const px = X(bb), py = Y(v); bb ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  curva(bb => Math.sqrt((1 + bb) / (1 - bb)), '#FF6B6B');
  curva(bb => Math.sqrt((1 - bb) / (1 + bb)), COL.azul);
  curva(bb => gam(bb), COL.ok, [5, 4]);
  curva(bb => 1 - bb, 'rgba(110,168,255,.35)', [2, 3]);
  curva(bb => 1 + bb, 'rgba(255,107,107,.35)', [2, 3]);
  const b = S.beta;
  linea(ctx, X(b), m.t, X(b), h - m.b, COL.acc, 1, [3, 3]);
  punto(ctx, X(b), Y(Math.sqrt((1 + b) / (1 - b))), 4.5, '#FF6B6B');
  punto(ctx, X(b), Y(Math.sqrt((1 - b) / (1 + b))), 4.5, COL.azul);
  const ly = h - m.b - 52;
  texto(ctx, '— se alejan √((1+β)/(1−β))', X(0.02), ly, { c:'#FF6B6B', f:11 });
  texto(ctx, '— se acercan √((1−β)/(1+β))', X(0.02), ly + 15, { c:COL.azul, f:11 });
  texto(ctx, '- - transversal: γ (solo dilatación)', X(0.02), ly + 30, { c:COL.ok, f:11 });
  texto(ctx, '··· clásico 1 ± β', X(0.02), ly - 15, { c:COL.tenue, f:11 });
}

/* ═════════════════════════  TEXTOS  ═════════════════════════ */

const INFO = {
  dilatacion: `
    <h3>Qué estás viendo</h3>
    <p>Un <b>reloj de luz</b>: un fotón rebota entre dos espejos y cada ida y vuelta es un tic. Los dos relojes son idénticos. Visto desde el laboratorio, el fotón del reloj que se mueve recorre la diagonal, un camino más largo a la misma velocidad c, así que <b>tarda más por tic</b>.</p>
    <h3>La interpretación con la que te casas</h3>
    <div class="caja"><b>El tiempo propio Δτ lo mide el reloj que está presente en los dos eventos.</b> Es el intervalo <b>más corto</b>. Cualquier otro observador mide Δt = γΔτ, más largo.</div>
    <p>En la animación, los eventos A (sale el fotón) y B (vuelve) ocurren <b>en el reloj que se mueve</b>: él mide Δτ. El laboratorio los ve en dos sitios distintos y necesita dos relojes: mide Δt.</p>

    <h3>Trampas</h3>
    <p class="trampa">«El reloj en movimiento va lento» es recíproco: cada uno ve lento el del otro. No hay contradicción porque no están de acuerdo en qué eventos son simultáneos.</p>
    <p class="trampa">Muones: en el sistema de la Tierra su vida se alarga (γτ); en el del muón la atmósfera se contrae (L/γ). Las dos cuentas dan lo mismo.</p>
    <h3>Examen 2024, n.º 11</h3>
    <p>Avión a 960 km/h: β = 8.9×10⁻⁷, β²/2 ≈ 4×10⁻¹³. El intervalo propio está en el avión y el del laboratorio es el largo. Fíjate en cuál de los dos te dan como dato.</p>`,
  contraccion: `
    <h3>Qué estás viendo</h3>
    <p>Un tren de longitud propia L₀ = 4 pasa por un andén. Para medirlo, el andén dispara dos destellos <b>a la vez</b> (para él) que dejan marcas en las dos puntas. La distancia entre las marcas es <b>L = L₀/γ</b>.</p>
    <h3>La interpretación con la que te casas</h3>
    <div class="caja"><b>La longitud propia L₀ es la del objeto en su propio reposo.</b> Es la <b>más larga</b>. Quien lo ve pasar mide L = L₀/γ. Solo se contrae la dirección del movimiento: las perpendiculares quedan iguales.</div>
    <h3>¿Y desde el tren?</h3>
    <p>Toca <b>Visto desde el tren</b>. Ahora el tren mide L₀ y el andén es el contraído. Lo que cambia es la simultaneidad: para el tren, el destello de adelante ocurre <b>primero</b> (Δt' = γβΔx/c). Por eso el tren dice que el andén midió mal: marcó la punta antes que la cola.</p>
    <h3>En el diagrama</h3>
    <p>La franja roja es la historia del tren. El andén la corta en horizontal (sus eventos simultáneos) y mide <span class="f">L₀/γ</span>. El tren la corta por su propio eje x' (inclinado) y mide <span class="f">L₀</span>. La hipérbola punteada x² − (ct)² = L₀² dice dónde queda «4 unidades» en cada sistema. El corte azul se ve más largo en el papel, pero mide L₀: la escala de x' está estirada.</p>
    <h3>Trampas</h3>
    <p class="trampa">El volumen se contrae un factor 1/γ, no 1/γ³: solo cambia la dimensión paralela (Conquering §6.6, problema 9).</p>

  doppler: `

/* ═════════════════════════  CONTROL  ═════════════════════════ */

function pintar() {
  if (S.modo === 'dilatacion') { animDilatacion(); diagDilatacion(); }
  if (S.modo === 'contraccion') { animContraccion(); diagContraccion(); }
  if (S.modo === 'doppler') { animDoppler(); diagDoppler(); }
}

function ponerModo(m, hash = true) {
  if (!INFO[m]) m = 'dilatacion';
  S.modo = m; S.T = 0; S.marcas = null; frentes = []; tUltimo = -1e9;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('marcos').classList.toggle('oculto', m !== 'contraccion');
  $('ctrlDop').classList.toggle('oculto', m !== 'doppler');
  $('rotDiag').textContent = m === 'doppler' ? 'Cuánto cambia λ con β' : 'Diagrama de espacio-tiempo (c = 1, la luz va a 45°)';
  $('info').innerHTML = INFO[m];
  if (hash) history.replaceState(null, '', '#' + m);
  pintar();
}

function ponerBeta(b) {
  S.beta = Math.min(0.95, Math.max(0, +b));
  $('beta').value = S.beta; $('vb').textContent = S.beta.toFixed(2); $('vg').textContent = gam(S.beta).toFixed(3);
  S.marcas = null;
}

$('tabs').addEventListener('click', e => { const m = e.target.dataset?.m; if (m) ponerModo(m); });
$('beta').addEventListener('input', e => ponerBeta(e.target.value));
$('presets').addEventListener('click', e => { if (e.target.dataset.b) ponerBeta(e.target.dataset.b); });
$('marcos').addEventListener('click', e => {
  const f = e.target.dataset?.f; if (!f) return;
  S.marco = f; S.T = 0; S.marcas = null;
  document.querySelectorAll('#marcos button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
});
$('lam').addEventListener('input', e => { S.lam0 = +e.target.value; $('vl').textContent = S.lam0; });
$('caso22').addEventListener('click', () => { ponerBeta(0.6); S.lam0 = 400; $('lam').value = 400; $('vl').textContent = 400; });
$('play').addEventListener('click', () => { S.play = !S.play; $('play').textContent = S.play ? '❚❚ Pausa' : '▶ Seguir'; });
$('reset').addEventListener('click', () => { S.T = 0; S.marcas = null; frentes = []; tUltimo = -1e9; });
$('lento').addEventListener('click', () => {
  S.vel = S.vel === 1 ? 0.35 : 1; $('lento').classList.toggle('on', S.vel !== 1);
});
addEventListener('resize', pintar);
addEventListener('hashchange', () => ponerModo(location.hash.slice(1), false));

let ult = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ult) / 1000); ult = ahora;
  if (S.play) S.T += dt * S.vel;
  pintar();
  requestAnimationFrame(bucle);
}
ponerBeta(0.6);
ponerModo(location.hash.slice(1) || 'dilatacion', false);
// ?t=N avanza la animación N segundos paso a paso (para revisar capturas).
const tq = +new URLSearchParams(location.search).get('t') || 0;
for (let k = 0; k < tq / 0.04; k++) { S.T += 0.04; pintar(); }
requestAnimationFrame(bucle);
</script>
