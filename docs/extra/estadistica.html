<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estadística visual</title>
<style>
  :root { --bg:#0B0718; --panel:#150E2B; --panel2:#1D1439; --ink:#E8E2F2; --muted:#9C93B5; --tenue:#6F6690;
          --line:#2A1F4A; --acc:#FCA50A; --ter:#F37819; --ok:#F6D543; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:980px; margin:0 auto; padding:12px 16px 40px; }
  h1 { font-size:19px; margin:6px 0 2px; }
  p.sub { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .tabs { display:flex; gap:6px; margin:8px 0 8px; }
  .tabs button { flex:1; font:inherit; font-size:14px; padding:9px 4px; border-radius:2px; border:1px solid var(--line);
                 background:var(--panel); color:var(--ink); cursor:pointer; }
  .tabs button.on { background:var(--acc); color:#0B0718; border-color:var(--acc); font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  canvas { width:100%; display:block; border:1px solid var(--line); border-radius:2px; background:#100A22; touch-action:pinch-zoom; }
  .ctrl { background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:12px 14px; margin-top:10px; }
  label { display:block; font-size:13px; color:var(--muted); margin-top:6px; }
  label b { color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .fila { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .fila button { font:inherit; font-size:13px; padding:6px 10px; border-radius:2px; border:1px solid var(--line);
                 background:var(--panel2); color:var(--ink); cursor:pointer; }
  .fila button.on { border-color:var(--acc); color:var(--acc); }
  .info { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--ter); border-radius:2px;
          padding:12px 14px; margin-top:10px; }
  .info h3 { font-size:13px; margin:12px 0 4px; color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
  .info h3:first-child { margin-top:0; }
  .info p { margin:4px 0; }
  .f { font-family:ui-monospace, monospace; font-size:14px; background:var(--panel2); padding:1px 5px; border-radius:2px; }
  .caja { background:var(--panel2); border:1px solid var(--line); padding:8px 10px; margin:6px 0; border-radius:2px; }
  .trampa { color:#FF7FB5; font-weight:600; }
  .oculto { display:none !important; }

  /* ── ANDES: paleta de la app (va al final para ganar) ── */
  :root { --bg:#0B0718; --panel:#150E2B; --ink:#E8E2F2; --muted:#9C93B5; --line:#2A1F4A; --acc:#FCA50A; --warn:#FF4F9A; }
  .seg button.on, button.main { color:#0B0718 !important; font-weight:600; }
  main { padding-top:8px; }
  canvas { border-radius:2px !important; touch-action:pinch-zoom; }
  input[type=range], input[type=checkbox] { accent-color:#FCA50A; }
</style>
<meta name="theme-color" content="#0B0718">
<link rel="stylesheet" href="comun.css">
</head>
<body>
<div class="andes-barra"><a href="../index.html#material">← Material</a><span class="andes-titulo">Estadística</span><button type="button" id="andes-completa">⤢ Pantalla completa</button></div>

<main>
  <h1>Entropía y multiplicidad, vistas</h1>
  <p class="sub">S = k ln Ω: el macroestado que gana es el que tiene más maneras de ocurrir.</p>

  <div class="tabs" id="tabs">
    <button data-m="monedas" class="on">Monedas</button>
    <button data-m="contacto">Contacto térmico</button>
  </div>

  <div class="grid">
    <canvas id="a"></canvas>
    <canvas id="b"></canvas>
  </div>

  <div class="ctrl">
    <div id="cMon">
      <label>Número de monedas: N = <b id="vN">20</b></label>
      <input id="N" type="range" min="2" max="200" step="1" value="20">
    </div>
    <div id="cCon">
      <label>Osciladores del sólido A: N<sub>A</sub> = <b id="vNA">10</b></label>
      <input id="NA" type="range" min="1" max="80" step="1" value="10">
      <label>Osciladores del sólido B: N<sub>B</sub> = <b id="vNB">30</b></label>
      <input id="NB" type="range" min="1" max="80" step="1" value="30">
      <label>Unidades de energía en total: q = <b id="vq">40</b></label>
      <input id="q" type="range" min="1" max="120" step="1" value="40">
      <div class="fila"><button id="todoA">Poner toda la energía en A</button></div>
    </div>
    <div class="fila"><button id="play">❚❚ Pausa</button></div>
  </div>

  <div class="info" id="info"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const COL = { bg:'#100A22', ink:'#E8E2F2', muted:'#9C93B5', tenue:'#6F6690', line:'#2A1F4A', acc:'#FCA50A', ok:'#F6D543', azul:'#6EA8FF', rosa:'#FF7FB5', ter:'#F37819' };
const dpr = Math.min(2, window.devicePixelRatio || 1);
const S = { modo:'monedas', N:20, NA:10, NB:30, q:40, play:true, monedas:[], osc:[], historia:[] };

function ajustar(cv, ratio) {
  const w = cv.clientWidth || 360, h = Math.round(w * ratio);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  return { ctx, w, h };
}
function texto(ctx, s, x, y, { c = COL.ink, f = 12, b = false, al = 'left' } = {}) { ctx.fillStyle = c; ctx.font = `${b ? '600 ' : ''}${f}px system-ui, sans-serif`; ctx.textAlign = al; ctx.fillText(s, x, y); }
function linea(ctx, x1, y1, x2, y2, c, w = 1, dash = null) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); }

/* ln n! y ln C(n, k) por suma de logaritmos (n ≤ ~300, suficiente aquí). */
const LF = [0]; for (let i = 1; i <= 400; i++) LF[i] = LF[i - 1] + Math.log(i);
const lnC = (n, k) => (k < 0 || k > n) ? -Infinity : LF[n] - LF[k] - LF[n - k];
const lnOmegaSolido = (N, q) => lnC(q + N - 1, q);     // Ω(N, q) = (q + N − 1)! / (q! (N − 1)!)
const fmtGrande = ln => { const l10 = ln / Math.LN10; return l10 < 6 ? Math.round(Math.exp(ln)).toLocaleString('es') : `10^${l10.toFixed(1)}`; };

/* ═════════════════════════  MONEDAS  ═════════════════════════ */

function reiniciarMonedas() { S.monedas = Array.from({ length: S.N }, () => Math.random() < .5 ? 1 : 0); }
function pintarMonedas() {
  const { ctx, w, h } = ajustar($('a'), 0.9);
  const n = S.N, cols = Math.ceil(Math.sqrt(n * w / h * 1.1)), filas = Math.ceil(n / cols);
  const cel = Math.min((w - 20) / cols, (h - 60) / filas), r = cel * .4;
  const caras = S.monedas.reduce((a, b) => a + b, 0);
  S.monedas.forEach((m, i) => {
    const x = 10 + (i % cols + .5) * cel, y = 40 + (Math.floor(i / cols) + .5) * cel;
    ctx.fillStyle = m ? COL.acc : '#3B2C66'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    if (r > 7) texto(ctx, m ? 'C' : 'S', x, y + r * .35, { c: m ? '#0B0718' : COL.muted, f: Math.max(8, r * .9), b: true, al:'center' });
  });
  texto(ctx, `Microestado al azar: ${caras} caras de ${n}`, 10, 22, { c:COL.ok, f:13, b:true });
  texto(ctx, `Ω(${caras}) = ${fmtGrande(lnC(n, caras))}`, w - 10, 22, { c:COL.muted, f:12, al:'right' });
}
function pintarHistMonedas() {
  const { ctx, w, h } = ajustar($('b'), 0.9);
  const n = S.N, m = { l:40, r:12, t:28, b:30 };
  const lmax = lnC(n, Math.floor(n / 2));
  const X = k => m.l + (k + .5) / (n + 1) * (w - m.l - m.r), Y = v => h - m.b - v * (h - m.t - m.b);
  const caras = S.monedas.reduce((a, b) => a + b, 0);
  const bw = Math.max(1, (w - m.l - m.r) / (n + 1) - 1);
  for (let k = 0; k <= n; k++) {
    const v = Math.exp(lnC(n, k) - lmax);
    ctx.fillStyle = k === caras ? COL.ok : 'rgba(243,120,25,.7)';
    ctx.fillRect(X(k) - bw / 2, Y(v), bw, Y(0) - Y(v));
  }
  linea(ctx, m.l, Y(0), w - m.r, Y(0), COL.muted);
  texto(ctx, '0', X(0), h - m.b + 14, { c:COL.tenue, f:10, al:'center' }); texto(ctx, n, X(n), h - m.b + 14, { c:COL.tenue, f:10, al:'center' });
  texto(ctx, 'número de caras', w - m.r, h - 6, { c:COL.muted, f:11, al:'right' });
  // ancho ~ √N
  const sig = Math.sqrt(n) / 2;
  linea(ctx, X(n / 2 - sig), Y(0.62), X(n / 2 + sig), Y(0.62), COL.azul, 2);
  texto(ctx, `ancho ~ √N/2 = ${sig.toFixed(1)}  (${(100 * sig / n).toFixed(1)} % de N)`, X(n / 2), Y(0.62) - 6, { c:COL.azul, f:11, al:'center' });
  texto(ctx, `Ω máx = C(${n}, ${Math.floor(n / 2)}) = ${fmtGrande(lmax)}`, m.l, m.t - 10, { c:COL.acc, f:12, b:true });
  texto(ctx, `S/k = ln Ω = ${lnC(n, caras).toFixed(2)}`, w - m.r, m.t - 10, { c:COL.ok, f:12, al:'right' });
}

/* ═════════════════════════  CONTACTO TÉRMICO  ═════════════════════════ */

function reiniciarOsc(todoA = false) {
  S.osc = new Array(S.NA + S.NB).fill(0);
  for (let i = 0; i < S.q; i++) S.osc[todoA ? Math.floor(Math.random() * S.NA) : Math.floor(Math.random() * (S.NA + S.NB))]++;
  S.historia = [];
}
const qA = () => S.osc.slice(0, S.NA).reduce((a, b) => a + b, 0);
function intercambiar(n) {   // un cuanto salta de un oscilador al azar (que tenga) a otro al azar
  const M = S.NA + S.NB;
  for (let k = 0; k < n; k++) {
    const i = Math.floor(Math.random() * M); if (!S.osc[i]) continue;
    const j = Math.floor(Math.random() * M); S.osc[i]--; S.osc[j]++;
  }
}
function pintarSolidos() {
  const { ctx, w, h } = ajustar($('a'), 0.9);
  const M = S.NA + S.NB, cols = Math.ceil(Math.sqrt(M * 1.6)), filas = Math.ceil(M / cols);
  const cel = Math.min((w - 30) / cols, (h - 110) / filas);
  const maxq = Math.max(3, ...S.osc);
  S.osc.forEach((v, i) => {
    const x = 10 + (i % cols) * cel, y = 36 + Math.floor(i / cols) * cel, esA = i < S.NA;
    ctx.fillStyle = esA ? 'rgba(252,165,10,.12)' : 'rgba(110,168,255,.12)'; ctx.fillRect(x + 1, y + 1, cel - 2, cel - 2);
    const hh = (cel - 4) * v / maxq;
    ctx.fillStyle = esA ? COL.acc : COL.azul; ctx.fillRect(x + 2, y + cel - 2 - hh, cel - 4, hh);
  });
  const a = qA();
  texto(ctx, `A: ${S.NA} osciladores, q_A = ${a}`, 10, 22, { c:COL.acc, f:13, b:true });
  texto(ctx, `B: ${S.NB}, q_B = ${S.q - a}`, w - 10, 22, { c:COL.azul, f:13, b:true, al:'right' });
  // traza de q_A en el tiempo
  const y0 = h - 12, y1 = h - 64, X = i => 10 + i / 300 * (w - 20), Y = v => y0 - v / S.q * (y0 - y1);
  linea(ctx, 10, y0, w - 10, y0, COL.line);
  const pico = qPico();
  linea(ctx, 10, Y(pico), w - 10, Y(pico), 'rgba(246,213,67,.5)', 1, [3, 3]);
  ctx.strokeStyle = COL.acc; ctx.lineWidth = 1.6; ctx.beginPath(); S.historia.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))); ctx.stroke();
  texto(ctx, `q_A(t) → el más probable (${pico})`, 12, y1 - 4, { c:COL.muted, f:11 });
}
function qPico() {
  let best = 0, bl = -Infinity;
  for (let a = 0; a <= S.q; a++) { const l = lnOmegaSolido(S.NA, a) + lnOmegaSolido(S.NB, S.q - a); if (l > bl) { bl = l; best = a; } }
  return best;
}
function pintarOmega() {
  const { ctx, w, h } = ajustar($('b'), 0.9);
  const m = { l:40, r:12, t:30, b:30 }, q = S.q;
  const ls = Array.from({ length: q + 1 }, (_, a) => lnOmegaSolido(S.NA, a) + lnOmegaSolido(S.NB, q - a));
  const lmax = Math.max(...ls), pico = ls.indexOf(lmax);
  const X = a => m.l + (a + .5) / (q + 1) * (w - m.l - m.r), Y = v => h - m.b - v * (h - m.t - m.b);
  const bw = Math.max(1, (w - m.l - m.r) / (q + 1) - 1), cur = qA();
  ls.forEach((l, a) => { const v = Math.exp(l - lmax); ctx.fillStyle = a === cur ? COL.ok : 'rgba(243,120,25,.7)'; ctx.fillRect(X(a) - bw / 2, Y(v), bw, Y(0) - Y(v)); });
  linea(ctx, m.l, Y(0), w - m.r, Y(0), COL.muted);
  texto(ctx, '0', X(0), h - m.b + 14, { c:COL.tenue, f:10, al:'center' }); texto(ctx, q, X(q), h - m.b + 14, { c:COL.tenue, f:10, al:'center' });
  texto(ctx, 'q_A', w - m.r, h - 6, { c:COL.muted, f:11, al:'right' });
  // proporcional: q_A/N_A = q_B/N_B
  const prop = q * S.NA / (S.NA + S.NB);
  linea(ctx, X(prop), m.t, X(prop), Y(0), COL.azul, 1, [4, 3]);
  texto(ctx, `q·N_A/(N_A+N_B) = ${prop.toFixed(1)}`, X(prop) + 4, m.t + 12, { c:COL.azul, f:11 });
  texto(ctx, `Ω_A·Ω_B, máximo en q_A = ${pico}`, m.l, m.t - 12, { c:COL.acc, f:12, b:true });
  texto(ctx, `Ω total = ${fmtGrande(lnOmegaSolido(S.NA + S.NB, q))}`, w - m.r, m.t - 12, { c:COL.muted, f:11, al:'right' });
}

/* ═════════════════════════  TEXTOS Y CONTROL  ═════════════════════════ */

const INFO = {
  monedas: () => `
    <h3>Qué estás viendo</h3>
    <p>N monedas que se lanzan una y otra vez. El <b>microestado</b> es la lista exacta de caras y sellos. El <b>macroestado</b> es solo cuántas caras hay. La barra amarilla es el macroestado de este momento.</p>
    <h3>Las fórmulas</h3>
    <p><span class="f">Ω(n) = C(N, n) = N!/(n!(N−n)!)</span> &nbsp; <span class="f">S = k ln Ω</span> &nbsp; total de microestados: <span class="f">2ᴺ</span></p>
    <div class="caja">Todos los microestados son igual de probables. El macroestado mitad y mitad gana porque tiene muchísimos más microestados. Al subir N, el pico se vuelve relativamente más angosto (~1/√N): por eso a escala macroscópica nunca ves fluctuaciones.</div>
    <h3>Trampas</h3>
    <p class="trampa">S = k ln Ω usa el logaritmo natural. Si te dan Ω = 2ᴺ, entonces S = Nk ln 2.</p>
    <p class="trampa">Las entropías se suman (S = S₁ + S₂) porque las multiplicidades se multiplican (Ω = Ω₁Ω₂).</p>`,
  contacto: () => `
    <h3>Qué estás viendo</h3>
    <p>Dos sólidos de Einstein (osciladores con energía en cuantos) que intercambian energía. Cada barrita es un oscilador; su altura es cuántos cuantos tiene. La energía salta al azar y q_A se va solo hacia el pico.</p>
    <h3>Las fórmulas</h3>
    <p><span class="f">Ω(N, q) = (q + N − 1)!/(q!(N − 1)!)</span> &nbsp; total: <span class="f">Ω = Ω_A(q_A)·Ω_B(q − q_A)</span></p>
    <div class="caja">El macroestado más probable maximiza Ω_A·Ω_B, o sea S_A + S_B. Ahí <span class="f">∂S_A/∂U_A = ∂S_B/∂U_B</span>, que es la definición de <b>temperaturas iguales</b>: <span class="f">1/T = ∂S/∂U</span>. Para sólidos grandes, el pico queda donde la energía por oscilador es la misma en los dos.</div>
    <p>Mira la diferencia: «Poner toda la energía en A» arranca lejos del equilibrio, y el sistema baja solo hacia el pico. Eso es la <b>segunda ley</b>: no es una fuerza, es que hay muchísimas más maneras de estar en el pico.</p>
    <h3>Trampas</h3>
    <p class="trampa">El más probable no es «la mitad de la energía para cada uno»: es proporcional al número de osciladores.</p>
    <p class="trampa">Con N y q chiquitos, el pico es ancho y las fluctuaciones se ven. Con N grande, el pico es casi una línea.</p>`,
};
function pintar() { if (S.modo === 'monedas') { pintarMonedas(); pintarHistMonedas(); } else { pintarSolidos(); pintarOmega(); } }
function ponerModo(m, hash = true) {
  S.modo = INFO[m] ? m : 'monedas';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === S.modo));
  $('cMon').classList.toggle('oculto', S.modo !== 'monedas'); $('cCon').classList.toggle('oculto', S.modo !== 'contacto');
  $('info').innerHTML = INFO[S.modo]();
  if (hash) history.replaceState(null, '', '#' + S.modo);
  pintar();
}
$('tabs').addEventListener('click', e => { if (e.target.dataset.m) ponerModo(e.target.dataset.m); });
$('N').addEventListener('input', e => { S.N = +e.target.value; $('vN').textContent = S.N; reiniciarMonedas(); });
for (const [id, k] of [['NA', 'NA'], ['NB', 'NB'], ['q', 'q']]) $(id).addEventListener('input', e => { S[k] = +e.target.value; $('v' + id).textContent = S[k]; reiniciarOsc(); });
$('todoA').addEventListener('click', () => reiniciarOsc(true));
$('play').addEventListener('click', () => { S.play = !S.play; $('play').textContent = S.play ? '❚❚ Pausa' : '▶ Seguir'; });
addEventListener('resize', pintar);
let acum = 0, ult = performance.now();
function bucle(t) {
  const dt = Math.min(0.1, (t - ult) / 1000); ult = t; acum += dt;
  if (S.play && acum > 0.12) {
    acum = 0;
    if (S.modo === 'monedas') reiniciarMonedas();
    else { intercambiar(Math.max(4, (S.NA + S.NB) / 3)); S.historia.push(qA()); if (S.historia.length > 300) S.historia.shift(); }
  }
  pintar(); requestAnimationFrame(bucle);
}
reiniciarMonedas(); reiniciarOsc(true);
ponerModo(location.hash.slice(1) || 'monedas', false);
requestAnimationFrame(bucle);
</script>
<script src="comun.js"></script>
</body>
</html>
