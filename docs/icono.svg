<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="ANDES: cordillera con el gradiente inferno">
  <defs>
    <!-- La rampa de inferno, de la base violeta a la cima amarilla -->
    <linearGradient id="inferno" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0.00" stop-color="#160B39"/>
      <stop offset="0.18" stop-color="#420A68"/>
      <stop offset="0.36" stop-color="#932667"/>
      <stop offset="0.54" stop-color="#DD513A"/>
      <stop offset="0.74" stop-color="#F37819"/>
      <stop offset="0.89" stop-color="#FCA50A"/>
      <stop offset="1.00" stop-color="#FCFFA4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0B0718"/>

  <!-- Cordillera: pico principal y uno secundario -->
  <path d="M52 396 L196 116 L272 258 L332 172 L460 396 Z" fill="url(#inferno)"/>

  <!-- Línea de horizonte -->
  <rect x="52" y="404" width="408" height="4" fill="#FCA50A"/>
</svg>
