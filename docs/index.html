<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0718">
<title>ANDES</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/estilo.css">
<!-- KaTeX va local, con sus fuentes: la app tiene que funcionar sin datos.
     Sin defer, para que window.katex ya exista cuando corran los módulos. -->
<script src="vendor/katex/katex.min.js"></script>
</head>
<body>

<header class="barra-superior">
  <div class="marca">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="inferno-marca" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0.00" stop-color="#420A68"/>
          <stop offset="0.36" stop-color="#932667"/>
          <stop offset="0.60" stop-color="#DD513A"/>
          <stop offset="0.82" stop-color="#FCA50A"/>
          <stop offset="1.00" stop-color="#FCFFA4"/>
        </linearGradient>
      </defs>
      <path d="M20 400 L196 96 L272 246 L332 158 L492 400 Z" fill="url(#inferno-marca)"/>
      <rect x="20" y="418" width="472" height="26" fill="#FCA50A"/>
    </svg>
    <span class="nombre">ANDES</span>
  </div>
  <div class="cuenta-regresiva">
    <strong id="dias-restantes">—</strong>
    <span>días</span>
  </div>
</header>

<main id="vistas">

  <!-- ─────────────────────────  HOY  ───────────────────────── -->
  <section class="vista" id="vista-hoy" hidden>
    <div class="cargando">Cargando…</div>
  </section>

  <!-- ─────────────────────────  FEED  ──────────────────────── -->
  <section class="vista vista-feed" id="vista-feed" hidden>
    <div class="progreso-sesion" id="progreso-sesion">
      <div class="barra-meta"><div class="barra-meta-relleno" id="barra-meta"></div></div>
      <div class="progreso-texto">
        <span id="progreso-conteo">0 / 30</span>
        <span id="progreso-acierto"></span>
      </div>
    </div>
    <div id="feed"></div>
    <div id="centinela" class="centinela"></div>
  </section>

  <!-- ─────────────────────────  HOJA  ──────────────────────── -->
  <section class="vista" id="vista-hoja" hidden>
    <div class="cargando">Cargando…</div>
  </section>

  <!-- ─────────────────────────  PLAN  ──────────────────────── -->
  <section class="vista" id="vista-plan" hidden>
    <div class="cargando">Cargando…</div>
  </section>

  <!-- ───────────────────────  SIMULACRO  ────────────────────── -->
  <section class="vista vista-simulacro" id="vista-simulacro" hidden></section>

  <!-- ──────────────────────────  YO  ───────────────────────── -->
  <section class="vista" id="vista-yo" hidden>
    <div class="cargando">Cargando…</div>
  </section>

</main>

<nav class="barra-inferior">
  <button data-vista="hoy"  class="activa"><span class="icono">◉</span><span>Hoy</span></button>
  <button data-vista="feed"><span class="icono">≋</span><span>Feed</span></button>
  <button data-vista="hoja"><span class="icono">≡</span><span>Hoja</span></button>
  <button data-vista="plan"><span class="icono">▦</span><span>Plan</span></button>
  <button data-vista="yo"><span class="icono">◑</span><span>Yo</span></button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
